services:
  collector:
    build: .
    container_name: nxreport-collector
    command: python3 collector.py --db /data/nxreport.db --port 5140
    ports:
      # UDP, not TCP — NxCloud/NxFilter syslog export is UDP. Get the
      # /udp suffix wrong here and logs vanish with no error anywhere.
      - "5140:5140/udp"
    volumes:
      - nxreport-data:/data
    restart: unless-stopped

  dashboard:
    build: .
    container_name: nxreport-dashboard
    command: gunicorn -w 2 -b 0.0.0.0:8080 app:app
    environment:
      NXREPORT_DB: /data/nxreport.db
      NXREPORT_BRAND: "Net Sheriff"
      # Set a real fixed value here (openssl rand -hex 32) once this is
      # live — leaving it unset means every container restart logs every
      # client out, since app.py falls back to a random key per process.
      NXREPORT_SECRET_KEY: ${NXREPORT_SECRET_KEY:?set NXREPORT_SECRET_KEY in .env}
    volumes:
      - nxreport-data:/data
    ports:
      # Bind to loopback only — nginx (with TLS) is what the client and
      # the internet should ever actually reach. Nothing should hit 8080
      # directly from outside the CT.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  nxreport-data:
