# Catch-all for requests that don't match either configured domain name —
# e.g. a bare-IP request like NxRelay's hxlistener registration call, or a
# blocked client being redirected to this box's raw IP. Without this,
# nginx silently 404s anything that isn't filter.synthesis-it.co.uk or
# portal.netsheriff.co.uk, which is exactly what broke NxRelay's connection
# to NxCloud (confirmed via nxrelay.log: connects fine, gets an empty/404
# response back instead of NxCloud's actual reply).
#
# Deliberately kept as its own file, separate from netsheriff.conf, since
# that one is certbot-managed and shouldn't be hand-edited.

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
