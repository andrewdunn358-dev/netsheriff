# ============================================================================
# THIS FILE IS CERTBOT-MANAGED ON THE LIVE SERVER.
#
# Do NOT edit this file and copy it over the live config at
# /etc/nginx/sites-enabled/netsheriff.conf — certbot inserts SSL directives
# (listen 443, cert paths, HTTP->HTTPS redirect blocks) directly into the
# live file, and none of that exists in this repo copy. Overwriting the
# live file with this one will silently strip HTTPS from both domains.
#
# Correct workflow:
#   - Need to change something non-SSL (proxy_pass, client_max_body_size,
#     etc.)? Edit the LIVE file directly on the server, then run
#     `nginx -t && systemctl reload nginx`, then copy the live file back
#     into this repo to keep it in sync (see below).
#   - Pulling the live file back into the repo:
#       cat /etc/nginx/sites-enabled/netsheriff.conf
#     then paste the output here, replacing everything below this comment
#     block.
#
# This exact incident happened once already (2026-09-03): copying this
# repo's stale pre-SSL version over the live config took down HTTPS for
# both filter.synthesis-it.co.uk and portal.netsheriff.co.uk until
# `certbot --nginx -d filter.synthesis-it.co.uk -d portal.netsheriff.co.uk`
# was re-run to reinstall the SSL config. Don't repeat it.
# ============================================================================

server {
    server_name filter.synthesis-it.co.uk;
    client_max_body_size 20M;
    location / {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/filter.synthesis-it.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/filter.synthesis-it.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    server_name portal.netsheriff.co.uk;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/filter.synthesis-it.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/filter.synthesis-it.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = filter.synthesis-it.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name filter.synthesis-it.co.uk;
    return 404; # managed by Certbot
}
server {
    if ($host = portal.netsheriff.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name portal.netsheriff.co.uk;
    return 404; # managed by Certbot
}
