<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand }} — New Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<style>
  :root { color-scheme: light dark; }
  .viz-root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --ring:rgba(11,11,11,0.10);
    --brand-orange:#ee4b00; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --ring:rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; }
  body.viz-root {
    margin:0; background:var(--page); color:var(--ink-1);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .wrap { max-width:480px; margin:0 auto; padding:28px 20px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  header h1 { font-size:20px; margin:0; }
  header a { font-size:13px; color:var(--brand-orange); text-decoration:none; }
  .card {
    background:var(--surface-1); border:1px solid var(--ring); border-radius:12px;
    padding:24px 22px;
  }
  label { display:block; font-size:12px; color:var(--ink-2); margin:0 0 4px; }
  .hint { font-size:11px; color:var(--ink-3); margin:-12px 0 14px; }
  input {
    width:100%; padding:9px 10px; margin-bottom:14px; font-size:14px;
    border:1px solid var(--grid); border-radius:8px; background:var(--page);
    color:var(--ink-1);
  }
  input:focus { outline:2px solid var(--brand-orange); outline-offset:1px; }
  button {
    width:100%; padding:10px; font-size:14px; font-weight:600; color:#fff;
    background:var(--brand-orange); border:none; border-radius:8px; cursor:pointer; margin-top:6px;
  }
  button:hover { filter:brightness(0.92); }
  .error {
    background:rgba(208,59,59,0.1); color:var(--critical); font-size:13px;
    padding:8px 10px; border-radius:8px; margin-bottom:16px;
  }
</style>
</head>
<body class="viz-root">
  <div class="wrap">
    <header>
      <h1>New admin</h1>
      <a href="/admin/admins">&larr; Back</a>
    </header>
    <div class="card">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required>
        <p class="hint">At least 8 characters. Share this with them securely — they can change it themselves afterwards.</p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <p class="hint">Required — needed so they can reset their own password if forgotten.</p>

        <button type="submit">Create admin</button>
      </form>
    </div>
  </div>
</body>
</html>
