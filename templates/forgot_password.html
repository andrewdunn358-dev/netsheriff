<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand }} — Reset Password</title>
<style>
  :root { color-scheme: light dark; }
  .viz-root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --ring:rgba(11,11,11,0.10);
    --s1:#2a78d6; --critical:#d03b3b; --good-text:#006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --ring:rgba(255,255,255,0.10);
      --s1:#3987e5; --critical:#e35b5b; --good-text:#0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body.viz-root {
    margin:0; background:var(--page); color:var(--ink-1);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card {
    width:100%; max-width:380px; margin:20px; background:var(--surface-1);
    border:1px solid var(--ring); border-radius:12px; padding:32px 28px;
  }
  .card h1 { font-size:20px; margin:0 0 4px; }
  .card .sub { color:var(--ink-2); font-size:13px; margin:0 0 24px; }
  label { display:block; font-size:12px; color:var(--ink-2); margin:0 0 4px; }
  input {
    width:100%; padding:9px 10px; margin-bottom:16px; font-size:14px;
    border:1px solid var(--grid); border-radius:8px; background:var(--page);
    color:var(--ink-1);
  }
  input:focus { outline:2px solid var(--s1); outline-offset:1px; }
  button {
    width:100%; padding:10px; font-size:14px; font-weight:600; color:#fff;
    background:var(--s1); border:none; border-radius:8px; cursor:pointer;
  }
  button:hover { filter:brightness(0.92); }
  .message {
    background:rgba(42,120,214,0.1); color:var(--s1); font-size:13px;
    padding:10px; border-radius:8px; margin-bottom:16px; line-height:1.5;
  }
  .foot { text-align:center; color:var(--ink-3); font-size:11px; margin-top:20px; }
  .foot a { color:var(--s1); text-decoration:none; }
  .foot a:hover { text-decoration:underline; }
</style>
</head>
<body class="viz-root">
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your username or email and we'll send you a reset link.</p>
    {% if message %}
      <div class="message">{{ message }}</div>
    {% else %}
      <form method="post">
        <label for="identifier">Username or email</label>
        <input id="identifier" name="identifier" required autofocus>
        <button type="submit">Send reset link</button>
      </form>
    {% endif %}
    <p class="foot"><a href="/login">Back to login</a></p>
    <p class="foot">{{ brand }}</p>
  </div>
</body>
</html>
