<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand }} — Net Sheriff Login</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<style>
  :root {
    --brand-orange:#ee4b00; --brand-orange-dark:#c33e00;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --critical:#d03b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#0d0805 url('{{ url_for("static", filename="img/hero.jpg") }}') center center / cover no-repeat;
    position:relative;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:linear-gradient(180deg, rgba(8,5,3,0.55), rgba(8,5,3,0.75));
  }
  .card {
    position:relative; z-index:1;
    width:100%; max-width:360px; margin:20px; background:rgba(252,252,251,0.97);
    border:1px solid rgba(238,75,0,0.25); border-radius:12px; padding:32px 28px;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
  }
  .card h1 { font-size:20px; margin:0 0 4px; color:var(--ink-1); }
  .card .sub { color:var(--ink-2); font-size:13px; margin:0 0 24px; }
  label { display:block; font-size:12px; color:var(--ink-2); margin:0 0 4px; }
  input {
    width:100%; padding:9px 10px; margin-bottom:16px; font-size:14px;
    border:1px solid var(--grid); border-radius:8px; background:#fff;
    color:var(--ink-1);
  }
  input:focus { outline:2px solid var(--brand-orange); outline-offset:1px; }
  button {
    width:100%; padding:10px; font-size:14px; font-weight:600; color:#fff;
    background:var(--brand-orange); border:none; border-radius:8px; cursor:pointer;
  }
  button:hover { background:var(--brand-orange-dark); }
  .error {
    background:rgba(208,59,59,0.1); color:var(--critical); font-size:13px;
    padding:8px 10px; border-radius:8px; margin-bottom:16px;
  }
  .foot { text-align:center; color:var(--ink-3); font-size:11px; margin-top:20px; }
  .foot a { color:var(--brand-orange); text-decoration:none; font-weight:600; }
  .foot a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Net Sheriff</h1>
    <p class="sub">Smart DNS filtering. Complete control.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="foot"><a href="/forgot-password">Forgot password?</a></p>
    <p class="foot">{{ brand }}</p>
  </div>
</body>
</html>
